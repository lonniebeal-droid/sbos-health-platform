name: CI

on:
  push:
    branches: [ main, master, 'phase-**' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo (build/test/docker). It
# needs no write scopes on the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build -t sbos-health:ci .

      - name: Run container
        run: docker run -d --name sbos-ci -p 3000:3000 sbos-health:ci

      - name: Smoke-test runtime contract
        run: |
          # Wait for the server to accept connections.
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 1
          done
          set -e
          check() { # url expected-status
            code=$(curl -s -o /dev/null -w '%{http_code}' "$1")
            echo "GET $1 -> $code (expected $2)"
            test "$code" = "$2"
          }
          check http://localhost:3000/api/health 200
          check http://localhost:3000/api/docs/openapi.json 200   # served from docs/
          check http://localhost:3000/ 200                        # SPA index
          check http://localhost:3000/api/appointments 404        # removed stub

          # Client-error contract (regression guard for the 4xx error handler).
          post_status() { # url body expected
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$1" \
              -H "Content-Type: application/json" --data-binary "$2")
            echo "POST $1 -> $code (expected $3)"
            test "$code" = "$3"
          }
          post_status http://localhost:3000/api/ai/chat '{bad json' 400   # malformed body
          post_status http://localhost:3000/api/ai/chat '{}' 400          # missing prompt
          big=$(head -c 300000 </dev/zero | tr '\0' x)
          post_status http://localhost:3000/api/ai/chat "{\"prompt\":\"$big\"}" 413  # >256kb
          echo "runtime contract OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs sbos-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f sbos-ci || true
